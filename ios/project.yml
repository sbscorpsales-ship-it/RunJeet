name: RunJeetNative
options:
  bundleIdPrefix: com.runjeet
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  RunJeetNative:
    type: application
    platform: iOS
    sources:
      - path: RunJeetNative
        excludes:
          - README.md
          - Info.plist
          - RunJeetNative.entitlements
    info:
      path: RunJeetNative/Info.plist
      properties:
        CFBundleDisplayName: GATIVX
        CFBundleIdentifier: com.runjeet.nativeapp
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSMotionUsageDescription: "GATIVX uses your iPhone motion sensor to measure genuine steps."
        NSLocationWhenInUseUsageDescription: "GATIVX records your GPS route and distance during activities you start."
        NSLocationAlwaysAndWhenInUseUsageDescription: "GATIVX can continue recording an activity you started when your iPhone is locked."
        NSLocationAlwaysUsageDescription: "GATIVX uses background location only during an activity you start."
        NSHealthShareUsageDescription: "GATIVX reads your Apple Health activity data when access is available."
        NSHealthUpdateUsageDescription: "GATIVX saves workouts to Apple Health when you choose to export them."
    entitlements:
      path: RunJeetNative/RunJeetNative.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runjeet.nativeapp
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: RunJeetNative/Info.plist
        CODE_SIGN_ENTITLEMENTS: RunJeetNative/RunJeetNative.entitlements
