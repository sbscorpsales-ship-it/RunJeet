name: RunJeetNative
options:
  bundleIdPrefix: com.runjeet
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  RunJeetNative:
    type: application
    platform: iOS
    sources:
      - path: RunJeetNative
        excludes:
          - README.md
          - Info.plist
          - RunJeetNative.entitlements
    info:
      path: RunJeetNative/Info.plist
      properties:
        CFBundleDisplayName: RunJeet
        CFBundleIdentifier: com.runjeet.nativeapp
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: RunJeetNative/RunJeetNative.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runjeet.nativeapp
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: RunJeetNative/Info.plist
        CODE_SIGN_ENTITLEMENTS: RunJeetNative/RunJeetNative.entitlements
