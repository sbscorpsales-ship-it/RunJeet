name: iOS Native Build Check

# Do not cancel an in-progress iOS build when another commit arrives.
concurrency:
  group: runjeet-ios-native-build
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Compile for iOS simulator without signing
        working-directory: ios
        run: |
          xcodebuild -project RunJeetNative.xcodeproj -scheme RunJeetNative -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned iPhone device app with full HealthKit entitlements
        working-directory: ios
        run: |
          xcodebuild -project RunJeetNative.xcodeproj -scheme RunJeetNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package full-capability unsigned iPhone IPA
        run: |
          mkdir -p ios/ipa/Payload
          cp -R ios/device-build/Build/Products/Release-iphoneos/RunJeetNative.app ios/ipa/Payload/
          cd ios/ipa
          /usr/bin/zip -qry GATIVX-unsigned.ipa Payload
      - name: Upload full-capability iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: gativx-iphone-unsigned-ipa
          path: ios/ipa/RunJeet-unsigned.ipa
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: gativx-ios-simulator-build
          path: ios/build/Build/Products/Debug-iphonesimulator/RunJeetNative.app
