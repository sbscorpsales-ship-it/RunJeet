name: iOS Native Build Check

# Isolate each commit so a newer PR update cannot cancel an iOS build waiting for a macOS runner.
concurrency:
  group: runjeet-ios-native-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Compile for iOS simulator without signing
        working-directory: ios
        run: |
          xcodebuild -project RunJeetNative.xcodeproj -scheme RunJeetNative -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned iPhone device app with full HealthKit entitlements
        working-directory: ios
        run: |
          xcodebuild -project RunJeetNative.xcodeproj -scheme RunJeetNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package full-capability unsigned iPhone IPA
        run: |
          mkdir -p ios/ipa/Payload
          cp -R ios/device-build/Build/Products/Release-iphoneos/RunJeetNative.app ios/ipa/Payload/
          cd ios/ipa
          /usr/bin/zip -qry NURUN-unsigned.ipa Payload
      - name: Record full-capability IPA identity
        run: |
          echo "NURUN build: $GITHUB_SHA (full-entitlement-unsigned)" >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 ios/ipa/NURUN-unsigned.ipa | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload full-capability iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: nurun-iphone-unsigned-ipa-${{ github.sha }}
          path: ios/ipa/NURUN-unsigned.ipa
      - name: Compile iPhone free-sideload build without restricted HealthKit entitlements
        working-directory: ios
        run: |
          xcodebuild -project RunJeetNative.xcodeproj -scheme RunJeetNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath free-device-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS= SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) NURUN_FREE_SIDELOAD' build
      - name: Package Core Motion free-sideload IPA
        run: |
          mkdir -p ios/free-ipa/Payload
          cp -R ios/free-device-build/Build/Products/Release-iphoneos/RunJeetNative.app ios/free-ipa/Payload/
          cd ios/free-ipa
          /usr/bin/zip -qry NURUN-CoreMotion-free-sideload.ipa Payload
      - name: Verify IPA and record build identity
        run: |
          echo "NURUN build: $GITHUB_SHA (free-sideload-coremotion)" >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 ios/free-ipa/NURUN-CoreMotion-free-sideload.ipa | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload Core Motion free-sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nurun-iphone-free-sideload-coremotion-${{ github.sha }}
          path: ios/free-ipa/NURUN-CoreMotion-free-sideload.ipa
      - name: Record simulator build identity
        run: |
          echo "NURUN build: $GITHUB_SHA (simulator)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: nurun-ios-simulator-build-${{ github.sha }}
          path: ios/build/Build/Products/Debug-iphonesimulator/RunJeetNative.app
